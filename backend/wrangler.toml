name = "imam-mobile-api-dev"
main = "src/index.js"
compatibility_date = "2026-10-30"

# Placeholder policy (Decisions D7). Open access is allowed only in this development Worker.
# Story 11 removes AUTH_MODE. Never copy these values to a production Worker.
[vars]
DEPLOYMENT_KEY = "imam-mobile-dev"
ENVIRONMENT = "development"
AUTH_MODE = "dev-open"

[[d1_databases]]
binding = "DB"
database_name = "imam-mobile-dev-db"
database_id = "794cc2e7-fcef-473c-b06d-c5665656c6ca"
migrations_dir = "migrations"

# PR previews share the test-only development database. Never bind production here.
# Schema-changing branches need a separate reviewed migration/deployment plan.
[previews.vars]
DEPLOYMENT_KEY = "imam-mobile-dev-preview"
ENVIRONMENT = "development"
AUTH_MODE = "dev-open"

[[previews.d1_databases]]
binding = "DB"
database_name = "imam-mobile-dev-db"
database_id = "794cc2e7-fcef-473c-b06d-c5665656c6ca"
